<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bpLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291204"/>
    </linearGradient>
    <filter id="bpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="315" rx="90" ry="10" fill="#000000" opacity="0.25" filter="blur(5px)"/>
  <!-- Top Handle -->
  <path d="M 170 80 C 170 50, 230 50, 230 80" stroke="#451a03" stroke-width="8" fill="none"/>
  <!-- Main Body -->
  <rect x="130" y="80" width="140" height="220" rx="35" fill="url(#bpLeather)" filter="url(#bpShadow)"/>
  <!-- Front Pocket -->
  <rect x="145" y="190" width="110" height="90" rx="15" fill="#291204"/>
  <!-- Zipper -->
  <path d="M 155 185 L 245 185" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3,2"/>
  <rect x="195" y="180" width="10" height="10" rx="2" fill="#fbbf24"/>
</svg>

