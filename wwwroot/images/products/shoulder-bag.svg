<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="sbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="315" rx="120" ry="12" fill="#000000" opacity="0.25" filter="blur(5px)"/>
  <!-- Shoulder strap -->
  <path d="M 120 180 C 120 40, 280 40, 280 180" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="6,4"/>
  <!-- Bag Body -->
  <rect x="110" y="170" width="180" height="130" rx="20" fill="url(#pinkLeather)" filter="url(#sbShadow)"/>
  <!-- Quilt stitch pattern -->
  <path d="M 110 200 L 290 280 M 110 240 L 290 320 M 110 280 L 190 320 M 110 240 L 250 170 M 150 300 L 290 230 M 190 300 L 290 250" 
        stroke="#fda4af" stroke-width="1.5" opacity="0.4"/>
  <!-- Flap -->
  <path d="M 110 170 L 290 170 L 290 230 L 200 255 L 110 230 Z" fill="#db2777"/>
  <!-- Clasp -->
  <circle cx="200" cy="250" r="12" fill="url(#gold)"/>
  <circle cx="200" cy="250" r="6" fill="#831843"/>
</svg>

