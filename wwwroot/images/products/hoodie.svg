<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="315" rx="110" ry="10" fill="#000000" opacity="0.25" filter="blur(5px)"/>
  <!-- Hood behind -->
  <path d="M 150 110 C 140 40, 260 40, 250 110 Z" fill="#1f2937"/>
  <!-- Main Torso & Sleeves -->
