  <circle cx="185" cy="162" r="3" fill="#d1d5db"/>
  <path d="M 215 105 L 215 155" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
  <circle cx="215" cy="157" r="3" fill="#d1d5db"/>
